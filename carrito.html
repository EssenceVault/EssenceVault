<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Carrito — Essence Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Montserrat", sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      animation: fadeInPage 0.35s ease;
    }

    @keyframes fadeInPage {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    .topbar {
      background-color: #cfd5dc;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      color: #7c848d;
      font-size: 1.05rem;
      font-weight: 800;
      text-decoration: none;
      line-height: 1;
    }

    .back-btn {
      background: linear-gradient(180deg, #fce055 0%, #eab308 100%);
      color: #000000;
      border: 3px solid #000000;
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 0.88rem;
      font-weight: 800;
      text-decoration: none;
    }

    .wrap {
      max-width: 940px;
      margin: 22px auto;
      padding: 0 14px 48px;
    }

    .title-bar {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .panel {
      background: linear-gradient(180deg, #9aa3b0 0%, #59606b 100%);
      border-radius: 34px;
      padding: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 20px;
      align-items: start;
    }

    .card {
      background-color: #ffffff;
      border: 4px solid #000000;
      border-radius: 26px;
      padding: 20px;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 2px solid #e5e7eb;
    }

    .item-row:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .item-name {
      font-weight: 800;
      font-size: 1rem;
      text-transform: uppercase;
    }

    .item-meta {
      font-size: 0.84rem;
      color: #4b5563;
      margin-top: 3px;
    }

    .qty-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      border: 2px solid #000000;
      border-radius: 8px;
      background-color: #f3f4f6;
      font-weight: 800;
      cursor: pointer;
    }

    .item-price-col {
      text-align: right;
    }

    .item-subtotal {
      font-weight: 800;
      font-size: 1.05rem;
    }

    .remove-btn {
      margin-top: 6px;
      background: none;
      border: none;
      color: #dc2626;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
    }

    .summary-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.92rem;
      margin-bottom: 10px;
    }

    .buy-now-btn {
      margin-top: 14px;
      width: 100%;
      background: linear-gradient(180deg, #4ade80 0%, #15803d 100%);
      color: #000000;
      border: 3px solid #000000;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .buy-now-btn:hover {
      transform: translateY(-1px);
    }

    .empty {
      text-align: center;
      padding: 24px;
    }

    .empty a {
      display: inline-block;
      margin-top: 12px;
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      color: #000000;
      border: 3px solid #000000;
      border-radius: 999px;
      padding: 7px 16px;
      text-decoration: none;
      font-weight: 800;
    }

    @media (max-width: 720px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="brand">ESSENCE<br />VAULT</a>
    <a href="index.html" class="back-btn">&larr; Seguir comprando</a>
  </header>

  <main class="wrap">
    <h1 class="title-bar">Mi carrito 🛒</h1>
    <div class="panel">
      <div id="cartView"></div>
    </div>
  </main>

  <script>
    const cartView = document.getElementById("cartView");

    function loadCart() {
      return JSON.parse(localStorage.getItem("essence_cart") || "[]");
    }

    function saveCart(data) {
      localStorage.setItem("essence_cart", JSON.stringify(data));
    }

    function render() {
      const cart = loadCart();
      if (!cart.length) {
        cartView.innerHTML = `
          <div class="card empty">
            <h2>Tu carrito está vacío</h2>
            <a href="producto.html?id=1">Ver Camisa Essentials ($350)</a>
          </div>
        `;
        return;
      }

      const totalQty = cart.reduce((acc, x) => acc + x.qty, 0);
      const normalPriceTotal = cart.reduce((acc, x) => acc + x.price * x.qty, 0);

      const rows = cart
        .map(
          (item, idx) => `
          <div class="item-row">
            <div>
              <div class="item-name">${item.name}</div>
              <div class="item-meta">Talla: <strong>${item.size}</strong> · Cantidad: <strong>${item.qty}</strong> · Precio normal: <strong>$${item.price} c/u</strong></div>
              <div class="qty-box">
                <button type="button" class="qty-btn" data-act="dec" data-i="${idx}">-</button>
                <strong>${item.qty}</strong>
                <button type="button" class="qty-btn" data-act="inc" data-i="${idx}">+</button>
              </div>
            </div>
            <div class="item-price-col">
              <div class="item-subtotal">$${item.price * item.qty}</div>
              <button type="button" class="remove-btn" data-act="del" data-i="${idx}">Eliminar</button>
            </div>
          </div>
        `
        )
        .join("");

      cartView.innerHTML = `
        <div class="grid">
          <div class="card">${rows}</div>
          <div class="card">
            <h2 class="summary-title">Resumen (sin envío)</h2>
            <div class="summary-row">
              <span>Cantidad total:</span>
              <strong>${totalQty}</strong>
            </div>
            <div class="summary-row">
              <span>Precio normal:</span>
              <strong>$${normalPriceTotal} MXN</strong>
            </div>
            <button type="button" id="buyNowBtn" class="buy-now-btn">Comprar ahora</button>
          </div>
        </div>
      `;

      document.querySelectorAll("[data-act]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const i = Number(btn.dataset.i);
          const act = btn.dataset.act;
          const current = loadCart();
          if (act === "inc") current[i].qty += 1;
          if (act === "dec") {
            if (current[i].qty > 1) current[i].qty -= 1;
            else current.splice(i, 1);
          }
          if (act === "del") current.splice(i, 1);
          saveCart(current);
          render();
        });
      });

      document.getElementById("buyNowBtn").addEventListener("click", () => {
        window.location.href = "checkout.html";
      });
    }

    render();
  </script>
</body>
</html>
