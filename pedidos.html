<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Pedidos — Essence Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Montserrat", sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      opacity: 1;
      transition: opacity 0.35s ease;
    }

    .topbar {
      background-color: #cfd5dc;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      color: #7c848d;
      font-size: 1.05rem;
      font-weight: 800;
      text-decoration: none;
      line-height: 1;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn {
      background: linear-gradient(180deg, #fce055 0%, #eab308 100%);
      color: #000000;
      border: 3px solid #000000;
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 0.86rem;
      font-weight: 800;
      text-decoration: none;
    }

    .admin-link {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      color: #000000;
      border: 3px solid #000000;
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 0.86rem;
      font-weight: 800;
      text-decoration: none;
    }

    .wrap {
      max-width: 920px;
      margin: 22px auto;
      padding: 0 14px 48px;
    }

    .page-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .panel {
      background: linear-gradient(180deg, #9aa3b0 0%, #59606b 100%);
      border-radius: 34px;
      padding: 22px;
    }

    .order-card {
      background-color: #ffffff;
      border: 4px solid #000000;
      border-radius: 26px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .order-card:last-child {
      margin-bottom: 0;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 2px solid #e5e7eb;
    }

    .order-id {
      font-weight: 900;
      font-size: 1rem;
    }

    .status-badge {
      padding: 5px 12px;
      border-radius: 999px;
      border: 2px solid #000000;
      font-size: 0.82rem;
      font-weight: 800;
      background-color: #fef08a;
    }

    .status-badge.preparando {
      background-color: #bae6fd;
    }

    .status-badge.enviado,
    .status-badge.entregado {
      background-color: #86efac;
    }

    .processing-line {
      font-size: 0.92rem;
      font-weight: 800;
      color: #111827;
      margin: 8px 0 10px;
    }

    .dynamic-dots {
      display: inline-block;
      width: 24px;
      text-align: left;
    }

    .order-meta {
      font-size: 0.86rem;
      color: #374151;
      line-height: 1.5;
    }

    .empty-box {
      background-color: #ffffff;
      border: 4px solid #000000;
      border-radius: 26px;
      padding: 28px;
      text-align: center;
    }

    .empty-box a {
      display: inline-block;
      margin-top: 12px;
      background: linear-gradient(180deg, #4ade80 0%, #15803d 100%);
      color: #000000;
      border: 3px solid #000000;
      border-radius: 999px;
      padding: 7px 16px;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="brand">ESSENCE<br />VAULT</a>
    <div class="nav-actions">
      <a href="index.html" class="back-btn">&larr; Inicio</a>
      <a href="admin.html" class="admin-link">Admin</a>
    </div>
  </header>

  <main class="wrap">
    <h1 class="page-title">Mis pedidos 📦</h1>
    <div class="panel">
      <div id="ordersContainer"></div>
    </div>
  </main>

  <script>
    const ordersContainer = document.getElementById("ordersContainer");
    let dotStep = 0;

    function safeReadOrders() {
      try {
        const raw = localStorage.getItem("essence_orders");
        return raw ? JSON.parse(raw) : [];
      } catch (_) {
        return [];
      }
    }

    function getDotsText() {
      const states = ["", ".", "..", "..."];
      return states[dotStep % states.length];
    }

    function renderOrders() {
      const orders = safeReadOrders();

      if (!orders.length) {
        ordersContainer.innerHTML = `
          <div class="empty-box">
            <h2>No tienes pedidos registrados aún</h2>
            <a href="producto.html?id=1">Explorar Camisa Essentials ($350)</a>
          </div>
        `;
        return;
      }

      ordersContainer.innerHTML = orders
        .map((order, idx) => {
          const status = order.status || "Procesando";
          const normalized = status.toLowerCase();

          let badgeClass = "status-badge";
          if (normalized === "preparando") {
            badgeClass = "status-badge preparando";
          } else if (normalized === "enviado") {
            badgeClass = "status-badge enviado";
          } else if (normalized === "entregado") {
            badgeClass = "status-badge entregado";
          }

          const processingBanner =
            normalized === "procesando"
              ? `<div class="processing-line">Procesando tu pedido<span class="dynamic-dots">${getDotsText()}</span></div>`
              : `<div class="processing-line">Estado actual: ${status}</div>`;

          return `
            <article class="order-card">
              <div class="order-top">
                <span class="order-id">Pedido #${idx + 1}</span>
                <span class="${badgeClass}">${status}</span>
              </div>
              ${processingBanner}
              <div class="order-meta">
                <div><strong>Prendas:</strong> ${order.summary || "1x CAMISA ESSENTIALS (M)"}</div>
                <div><strong>Ciudad / C.P.:</strong> ${order.city || "—"} · ${order.postalCode || "—"}</div>
                <div><strong>Método de pago:</strong> ${order.paymentMethod || "Transferencia"}</div>
                <div><strong>Total:</strong> $${order.total || 0} MXN</div>
              </div>
            </article>
          `;
        })
        .join("");
    }

    renderOrders();

    setInterval(() => {
      dotStep = (dotStep + 1) % 4;
      document.querySelectorAll(".dynamic-dots").forEach((el) => {
        el.textContent = getDotsText();
      });
    }, 450);

    window.addEventListener("storage", (e) => {
      if (e.key === "essence_orders") {
        renderOrders();
      }
    });
  </script>
</body>
</html>
