<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camisa Essentials — Essence Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Montserrat", sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      animation: fadeInPage 0.35s ease;
    }

    @keyframes fadeInPage {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    .topbar {
      background-color: #cfd5dc;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      color: #7c848d;
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1;
      text-decoration: none;
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .orders-top-btn {
      background: linear-gradient(180deg, #fce055 0%, #eab308 100%);
      color: #000000;
      border: 3px solid #000000;
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 0.88rem;
      font-weight: 800;
      text-decoration: none;
    }

    .cart-top-btn {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      color: #000000;
      border: 3px solid #000000;
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 0.88rem;
      font-weight: 800;
      text-decoration: none;
    }

    .container {
      max-width: 920px;
      margin: 24px auto;
      padding: 0 14px 48px;
    }

    .panel {
      background: linear-gradient(180deg, #9aa3b0 0%, #59606b 100%);
      border-radius: 34px;
      padding: 24px;
    }

    .product-box {
      background-color: #ffffff;
      border: 4px solid #000000;
      border-radius: 28px;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 26px;
      align-items: center;
    }

    .shirt-preview {
      background-color: #f3f4f6;
      border: 3px solid #000000;
      border-radius: 24px;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .id-tag {
      display: inline-block;
      background-color: #000000;
      color: #ffffff;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .details h1 {
      font-size: 1.65rem;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .details p {
      font-size: 0.9rem;
      color: #374151;
      line-height: 1.5;
    }

    .price {
      font-size: 1.45rem;
      font-weight: 800;
      margin: 14px 0;
    }

    .sizes {
      display: flex;
      gap: 8px;
      margin: 8px 0 16px;
    }

    .size-btn {
      background-color: #e5e7eb;
      color: #000000;
      border: 2.5px solid #000000;
      border-radius: 10px;
      padding: 7px 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .size-btn.active {
      background-color: #000000;
      color: #ffffff;
    }

    .qty-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0 18px;
    }

    .qty-btn {
      width: 34px;
      height: 34px;
      border: 2.5px solid #000000;
      border-radius: 8px;
      background-color: #ffffff;
      font-weight: 800;
      cursor: pointer;
    }

    .qty-num {
      min-width: 30px;
      text-align: center;
      font-weight: 800;
    }

    .add-btn {
      width: 100%;
      background: linear-gradient(180deg, #4ade80 0%, #15803d 100%);
      color: #000000;
      border: 3px solid #000000;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 0.96rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .add-btn:hover {
      transform: translateY(-1px);
    }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translate(-50%, 16px);
      background-color: #000000;
      color: #ffffff;
      border: 2px solid #4ade80;
      border-radius: 999px;
      padding: 10px 20px;
      font-size: 0.86rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 680px) {
      .product-box {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="brand">ESSENCE<br />VAULT</a>
    <div class="nav-group">
      <a href="index.html" class="orders-top-btn">&larr; Inicio</a>
      <a href="carrito.html" class="cart-top-btn">Mi carrito 🛒 (<span id="cartCount">0</span>)</a>
    </div>
  </header>

  <main class="container">
    <div class="panel">
      <div id="productContent" class="product-box"></div>
    </div>
  </main>

  <div id="toast" class="toast">Agregado al carrito</div>

  <script>
    const catalog = {
      1: {
        id: 1,
        name: "CAMISA ESSENTIALS",
        price: 350,
        description: "Camisa Essentials de algodón pesado con corte relajado y acabado limpio Essence Vault."
      }
    };

    const params = new URLSearchParams(window.location.search);
    const id = Number(params.get("id")) || 1;
    const item = catalog[id];
    const productContent = document.getElementById("productContent");
    const cartCountEl = document.getElementById("cartCount");
    const toast = document.getElementById("toast");

    let size = "M";
    let qty = 1;

    function updateBadge() {
      const cart = JSON.parse(localStorage.getItem("essence_cart") || "[]");
      cartCountEl.textContent = cart.reduce((s, x) => s + (x.qty || 1), 0);
    }

    if (!item) {
      productContent.innerHTML = `<div><h1>Producto no encontrado (id=${id})</h1></div>`;
    } else {
      productContent.innerHTML = `
        <div class="shirt-preview">
          <svg width="120" height="120" viewBox="0 0 120 120" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M38 18c5 7 10 10 22 10s17-3 22-10l22 14-11 22-13-7v59H40V43l-13 7-11-22 22-14z" fill="#ffffff"/>
            <path d="M38 18c5 7 10 10 22 10s17-3 22-10" />
            <path d="M16 32l11 18" />
            <path d="M104 32L93 50" />
            <path d="M40 97h40" />
          </svg>
          <span>Placeholder Producto</span>
        </div>
        <div class="details">
          <span class="id-tag">ID: ${item.id}</span>
          <h1>${item.name}</h1>
          <p>${item.description}</p>
          <div class="price">$${item.price} c/u</div>

          <div>
            <strong>Talla:</strong>
            <div class="sizes">
              <button type="button" class="size-btn" data-size="S">S</button>
              <button type="button" class="size-btn active" data-size="M">M</button>
              <button type="button" class="size-btn" data-size="L">L</button>
              <button type="button" class="size-btn" data-size="XL">XL</button>
            </div>
          </div>

          <div>
            <strong>Cantidad:</strong>
            <div class="qty-row">
              <button type="button" class="qty-btn" id="minusBtn">-</button>
              <span class="qty-num" id="qtyText">1</span>
              <button type="button" class="qty-btn" id="plusBtn">+</button>
            </div>
          </div>

          <button type="button" class="add-btn" id="addBtn">Agregar al carrito</button>
        </div>
      `;

      document.querySelectorAll(".size-btn").forEach((b) => {
        b.addEventListener("click", () => {
          document.querySelectorAll(".size-btn").forEach((x) => x.classList.remove("active"));
          b.classList.add("active");
          size = b.dataset.size;
        });
      });

      const qtyText = document.getElementById("qtyText");
      document.getElementById("minusBtn").addEventListener("click", () => {
        if (qty > 1) {
          qty -= 1;
          qtyText.textContent = qty;
        }
      });

      document.getElementById("plusBtn").addEventListener("click", () => {
        qty += 1;
        qtyText.textContent = qty;
      });

      document.getElementById("addBtn").addEventListener("click", () => {
        const cart = JSON.parse(localStorage.getItem("essence_cart") || "[]");
        const found = cart.find((c) => c.id === item.id && c.size === size);
        if (found) {
          found.qty += qty;
        } else {
          cart.push({ id: item.id, name: item.name, price: item.price, size, qty });
        }
        localStorage.setItem("essence_cart", JSON.stringify(cart));
        updateBadge();
        toast.textContent = `Agregado: ${qty}x ${item.name} (${size})`;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2200);
      });
    }

    updateBadge();
  </script>
</body>
</html>
