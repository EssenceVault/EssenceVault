<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Producto - Essence Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Montserrat", sans-serif;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
    }

    .topbar {
      background-color: #666666;
      border-bottom: 3px solid #000000;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      color: #ffffff;
      font-size: 1.45rem;
      font-weight: 600;
      text-decoration: none;
    }

    .back-btn {
      background-color: #ffffff;
      color: #000000;
      border: 2.5px solid #000000;
      border-radius: 9px;
      padding: 5px 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.88rem;
    }

    .container {
      max-width: 820px;
      margin: 28px auto;
      padding: 0 16px;
    }

    .product-panel {
      background-color: #bdbdbd;
      border: 4px solid #000000;
      border-radius: 28px;
      padding: 28px;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 28px;
      align-items: center;
      animation: popFromBottom 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes popFromBottom {
      from {
        opacity: 0;
        transform: translateY(45px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .image-placeholder {
      background-color: #ffffff;
      border: 4px solid #000000;
      border-radius: 26px;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .details h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .id-badge {
      display: inline-block;
      background: #000000;
      color: #ffffff;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .price {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 12px 0;
    }

    .sizes {
      display: flex;
      gap: 8px;
      margin: 12px 0 18px;
    }

    .size-btn {
      background: #ffffff;
      border: 2.5px solid #000000;
      border-radius: 8px;
      padding: 6px 13px;
      font-family: "Montserrat", sans-serif;
      font-weight: 700;
      cursor: pointer;
    }

    .size-btn.active {
      background: #000000;
      color: #ffffff;
    }

    .add-btn {
      width: 100%;
      background-color: #00a63e;
      color: #ffffff;
      border: 3px solid #000000;
      border-radius: 10px;
      padding: 11px 16px;
      font-family: "Montserrat", sans-serif;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
    }

    .add-btn:hover {
      background-color: #008f35;
    }

    /* Pop-up inferior de confirmación */
    .bottom-popup {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translate(-50%, 150%);
      background: #ffffff;
      border: 4px solid #000000;
      border-radius: 14px;
      padding: 12px 20px;
      font-weight: 700;
      z-index: 100;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .bottom-popup.open {
      transform: translate(-50%, 0);
    }

    @media (max-width: 640px) {
      .product-panel {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="brand">Essence Vault</a>
    <a href="index.html" class="back-btn">&larr; Volver al inicio</a>
  </header>

  <main class="container">
    <div id="productContainer" class="product-panel"></div>
  </main>

  <div id="bottomPopup" class="bottom-popup">
    Agregado a Mis pedidos
  </div>

  <script>
    const catalog = {
      1: {
        id: 1,
        name: "Camisa Essential",
        price: 599,
        description:
          "Camisa esencial de algodón pesado con corte boxy, cuello estructurado y acabado minimalista Essence Vault."
      }
    };

    const params = new URLSearchParams(window.location.search);
    const productId = Number(params.get("id")) || 1;
    const product = catalog[productId];
    const container = document.getElementById("productContainer");
    const bottomPopup = document.getElementById("bottomPopup");

    let selectedSize = "M";

    if (!product) {
      container.innerHTML = `
        <div style="grid-column: 1 / -1;">
          <h1>Producto no encontrado (id=${productId})</h1>
          <p style="margin-top: 8px;">Este enlace es un placeholder para futuros productos.</p>
        </div>
      `;
    } else {
      document.title = `${product.name} - Essence Vault`;

      container.innerHTML = `
        <div class="image-placeholder">
          <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>
          </svg>
          <span>Vista previa placeholder</span>
        </div>

        <div class="details">
          <span class="id-badge">ID: ${product.id}</span>
          <h1>${product.name}</h1>
          <p>${product.description}</p>
          <div class="price">$${product.price} MXN</div>

          <div>
            <strong>Talla:</strong>
            <div class="sizes" id="sizeGroup">
              <button type="button" class="size-btn" data-size="S">S</button>
              <button type="button" class="size-btn active" data-size="M">M</button>
              <button type="button" class="size-btn" data-size="L">L</button>
              <button type="button" class="size-btn" data-size="XL">XL</button>
            </div>
          </div>

          <button type="button" class="add-btn" id="addToOrdersBtn">
            Agregar a Mis pedidos
          </button>
        </div>
      `;

      document.querySelectorAll(".size-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".size-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          selectedSize = btn.dataset.size;
        });
      });

      document.getElementById("addToOrdersBtn").addEventListener("click", () => {
        const orders = JSON.parse(localStorage.getItem("essence_orders") || "[]");
        orders.push({
          id: product.id,
          name: product.name,
          price: product.price,
          size: selectedSize
        });
        localStorage.setItem("essence_orders", JSON.stringify(orders));

        bottomPopup.textContent = `Agregado: ${product.name} (${selectedSize})`;
        bottomPopup.classList.add("open");
        setTimeout(() => bottomPopup.classList.remove("open"), 2600);
      });
    }
  </script>
</body>
</html>
