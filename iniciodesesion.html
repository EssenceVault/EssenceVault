<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión / Crear Cuenta — Essence Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Montserrat", sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      animation: fadeInPage 0.35s ease;
    }

    @keyframes fadeInPage {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    .topbar {
      background-color: #cfd5dc;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      color: #7c848d;
      font-size: 1.05rem;
      font-weight: 800;
      text-decoration: none;
      line-height: 1.05;
    }

    .back-btn {
      background: linear-gradient(180deg, #fce055 0%, #eab308 100%);
      color: #000000;
      border: 3px solid #000000;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 800;
      text-decoration: none;
    }

    .page-wrap {
      max-width: 900px;
      margin: 28px auto;
      padding: 0 16px 48px;
    }

    .panel {
      background: linear-gradient(180deg, #9aa3b0 0%, #59606b 100%);
      border-radius: 32px;
      padding: 26px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 14px;
      border-radius: 999px;
      border: 3px solid #000000;
      background-color: #d4d4d8;
      color: #000000;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .tab-btn.active {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
    }

    .auth-card {
      background-color: #ffffff;
      border: 4px solid #000000;
      border-radius: 26px;
      padding: 24px;
      max-width: 480px;
      margin: 0 auto;
    }

    .auth-card h1 {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .auth-sub {
      font-size: 0.85rem;
      color: #4b5563;
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 0.84rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      height: 40px;
      border: 2.5px solid #000000;
      border-radius: 12px;
      padding: 0 12px;
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(180deg, #4ade80 0%, #15803d 100%);
      color: #000000;
      border: 3px solid #000000;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
    }

    .error-alert {
      margin-top: 14px;
      color: #dc2626;
      font-size: 0.9rem;
      font-weight: 800;
      text-align: center;
      min-height: 22px;
    }

    .info-alert {
      margin-top: 12px;
      color: #15803d;
      font-size: 0.86rem;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="brand">ESSENCE<br />VAULT</a>
    <a href="index.html" class="back-btn">&larr; Volver a la tienda</a>
  </header>

  <main class="page-wrap">
    <div class="panel">
      <div class="tabs">
        <button id="tabLogin" type="button" class="tab-btn active">Iniciar sesión</button>
        <button id="tabRegister" type="button" class="tab-btn">Crear sesión</button>
      </div>

      <!-- Formulario de Inicio de Sesión -->
      <form id="loginForm" class="auth-card">
        <h1>Iniciar sesión</h1>
        <p class="auth-sub">Ingresa tu usuario o correo electrónico y tu contraseña.</p>

        <div class="field">
          <label for="loginUser">Usuario o correo electrónico</label>
          <input id="loginUser" type="text" required placeholder="Ej. @usuario o correo@ejemplo.com" />
        </div>

        <div class="field">
          <label for="loginPass">Contraseña</label>
          <input id="loginPass" type="password" required placeholder="••••••••" />
        </div>

        <button type="submit" class="submit-btn">Entrar</button>
        <div id="loginError" class="error-alert"></div>
      </form>

      <!-- Formulario de Registro -->
      <form id="registerForm" class="auth-card" style="display: none;">
        <h1>Crear sesión</h1>
        <p class="auth-sub">Regístrate con tu correo electrónico para usar tu cuenta en Essence Vault.</p>

        <div class="field">
          <label for="regUsername">Nombre de usuario</label>
          <input id="regUsername" type="text" required placeholder="Ej. essence_fan" />
        </div>

        <div class="field">
          <label for="regEmail">Correo electrónico</label>
          <input id="regEmail" type="email" required placeholder="correo@ejemplo.com" />
        </div>

        <div class="field">
          <label for="regPass">Contraseña</label>
          <input id="regPass" type="password" required minlength="4" placeholder="Crea una contraseña" />
        </div>

        <button type="submit" class="submit-btn">Crear cuenta</button>
        <div id="registerError" class="error-alert"></div>
        <div id="registerSuccess" class="info-alert"></div>
      </form>
    </div>
  </main>

  <script>
    const tabLogin = document.getElementById("tabLogin");
    const tabRegister = document.getElementById("tabRegister");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const loginError = document.getElementById("loginError");
    const registerError = document.getElementById("registerError");
    const registerSuccess = document.getElementById("registerSuccess");

    tabLogin.addEventListener("click", () => {
      tabLogin.classList.add("active");
      tabRegister.classList.remove("active");
      loginForm.style.display = "block";
      registerForm.style.display = "none";
      loginError.textContent = "";
    });

    tabRegister.addEventListener("click", () => {
      tabRegister.classList.add("active");
      tabLogin.classList.remove("active");
      registerForm.style.display = "block";
      loginForm.style.display = "none";
      registerError.textContent = "";
      registerSuccess.textContent = "";
    });

    function getUsers() {
      return JSON.parse(localStorage.getItem("essence_users") || "[]");
    }

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      loginError.textContent = "";

      const identifier = document.getElementById("loginUser").value.trim().toLowerCase().replace(/^@/, "");
      const password = document.getElementById("loginPass").value;
      const users = getUsers();

      const matchedUser = users.find(
        (u) =>
          (u.username.toLowerCase() === identifier || u.email.toLowerCase() === identifier) &&
          u.password === password
      );

      if (!matchedUser) {
        loginError.textContent = "El Usuario o contraseña es incorrecto.";
        return;
      }

      localStorage.setItem("essence_active_session", JSON.stringify(matchedUser));
      window.location.href = "cuenta.html";
    });

    registerForm.addEventListener("submit", (e) => {
      e.preventDefault();
      registerError.textContent = "";
      registerSuccess.textContent = "";

      const username = document.getElementById("regUsername").value.trim().replace(/^@/, "");
      const email = document.getElementById("regEmail").value.trim().toLowerCase();
      const password = document.getElementById("regPass").value;
      const users = getUsers();

      const alreadyExists = users.some(
        (u) => u.username.toLowerCase() === username.toLowerCase() || u.email.toLowerCase() === email
      );

      if (alreadyExists) {
        registerError.textContent = "Este usuario o correo electrónico ya está registrado y no se puede usar.";
        return;
      }

      const newUser = { username, email, password };
      users.push(newUser);
      localStorage.setItem("essence_users", JSON.stringify(users));
      localStorage.setItem("essence_active_session", JSON.stringify(newUser));

      registerSuccess.textContent = "Cuenta creada. Redirigiendo a tu cuenta...";
      setTimeout(() => {
        window.location.href = "cuenta.html";
      }, 650);
    });
  </script>
</body>
</html>
