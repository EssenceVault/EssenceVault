<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Cuenta — Essence Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Montserrat", sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      animation: fadeInPage 0.35s ease;
    }

    @keyframes fadeInPage {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    .topbar {
      background-color: #cfd5dc;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      color: #7c848d;
      font-size: 1.05rem;
      font-weight: 800;
      text-decoration: none;
      line-height: 1.05;
    }

    .back-btn {
      background: linear-gradient(180deg, #fce055 0%, #eab308 100%);
      color: #000000;
      border: 3px solid #000000;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 800;
      text-decoration: none;
    }

    .wrap {
      max-width: 720px;
      margin: 30px auto;
      padding: 0 16px 48px;
    }

    .panel {
      background: linear-gradient(180deg, #9aa3b0 0%, #59606b 100%);
      border-radius: 32px;
      padding: 26px;
    }

    .account-card {
      background-color: #ffffff;
      border: 4px solid #000000;
      border-radius: 26px;
      padding: 24px;
    }

    .account-card h1 {
      font-size: 1.45rem;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .info-line {
      background-color: #f3f4f6;
      border: 2px solid #d1d5db;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .logout-btn {
      margin-top: 14px;
      background-color: #000000;
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="brand">ESSENCE<br />VAULT</a>
    <a href="index.html" class="back-btn">&larr; Volver a la tienda</a>
  </header>

  <main class="wrap">
    <div class="panel">
      <div id="accountCard" class="account-card"></div>
    </div>
  </main>

  <script>
    const session = JSON.parse(localStorage.getItem("essence_active_session") || "null");
    if (!session) {
      window.location.href = "iniciodesesion.html";
    } else {
      const card = document.getElementById("accountCard");
      card.innerHTML = `
        <h1>Mi Cuenta</h1>
        <div class="info-line">Usuario: <strong>@${session.username}</strong></div>
        <div class="info-line">Correo electrónico: <strong>${session.email}</strong></div>
        <div class="info-line">Estado de sesión: <strong>Activa</strong></div>
        <button id="logoutBtn" type="button" class="logout-btn">Cerrar sesión</button>
      `;

      document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("essence_active_session");
        window.location.href = "iniciodesesion.html";
      });
    }
  </script>
</body>
</html>
