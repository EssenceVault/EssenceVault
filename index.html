<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Essence Vault — Streetwear & Essentials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Montserrat", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      background-color: #f8f9fa;
      color: #111827;
      min-height: 100vh;
    }

    /* Barra superior moderna */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    }

    .brand {
      color: #111827;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #10b981;
    }

    .search-wrap {
      flex: 1;
      max-width: 420px;
      position: relative;
    }

    .search-input {
      width: 100%;
      height: 40px;
      background-color: #f3f4f6;
      border: 1.5px solid #e5e7eb;
      border-radius: 999px;
      padding: 0 16px 0 38px;
      font-size: 0.88rem;
      font-weight: 500;
      color: #111827;
      outline: none;
    }

    .search-input:focus {
      background-color: #ffffff;
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #6b7280;
      pointer-events: none;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .orders-btn {
      background-color: #10b981;
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 9px 18px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    .orders-btn:hover {
      background-color: #059669;
    }

    .orders-count {
      background-color: #111827;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
    }

    .profile-circle {
      width: 38px;
      height: 38px;
      background-color: #111827;
      border: none;
      border-radius: 50%;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Banner principal (Anuncio + Contador) */
    .hero-banner {
      background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
      color: #ffffff;
      padding: 48px 24px;
      text-align: center;
    }

    .hero-inner {
      max-width: 820px;
      margin: 0 auto;
    }

    .drop-pill {
      display: inline-block;
      background-color: rgba(16, 185, 129, 0.18);
      border: 1px solid #10b981;
      color: #34d399;
      padding: 6px 14px;
