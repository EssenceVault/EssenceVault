<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Essence Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Montserrat", sans-serif;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
    }

    /* Barra superior */
    .topbar {
      background-color: #666666;
      border-bottom: 3px solid #000000;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      color: #ffffff;
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      white-space: nowrap;
      text-decoration: none;
    }

    .search-wrap {
      flex: 1;
      max-width: 390px;
    }

    .search-input {
      width: 100%;
      height: 30px;
      background-color: #ffffff;
      border: 2.5px solid #000000;
      border-radius: 9px;
      padding: 2px 12px;
      font-family: "Montserrat", sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      color: #000000;
      outline: none;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .orders-btn {
      background-color: #00a63e;
      color: #ffffff;
      border: 2.5px solid #000000;
      border-radius: 9px;
      padding: 4px 14px;
      font-family: "Montserrat", sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }

    .orders-btn:hover {
      background-color: #008f35;
      transform: translateY(-1px);
    }

    .profile-circle {
      width: 34px;
      height: 34px;
      background-color: #000000;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.12s ease;
    }

    .profile-circle:hover {
      transform: scale(1.06);
    }

    /* Banner de anuncio */
    .announcement-banner {
      background-color: #787878;
      border-bottom: 4px solid #000000;
      min-height: 195px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .announcement-text {
      font-family: "Montserrat", sans-serif;
      font-size: clamp(2.4rem, 6vw, 4.4rem);
      color: #ffffff;
      letter-spacing: 2px;
      font-weight: 800;
    }

    /* Sección de productos destacados */
    .featured-section {
      padding: 14px 12px 24px;
    }

    .section-title {
      font-family: "Montserrat", sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
