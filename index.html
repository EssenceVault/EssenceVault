<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Essence Vault — Streetwear & Essentials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #0b0b0e;
      --bg-secondary: #141419;
      --bg-card: #191920;
      --border-subtle: rgba(255, 255, 255, 0.09);
      --text-main: #f5f5f7;
      --text-muted: #9a9aa6;
      --accent: #10b981;
      --accent-hover: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Montserrat", sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      animation: fadeInPage 0.45s ease-out;
    }

    @keyframes fadeInPage {
      from {
        opacity: 0.2;
      }
      to {
        opacity: 1;
      }
    }

    /* Navbar moderna estilo glass */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 11, 14, 0.82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      color: #ffffff;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .search-wrap {
      flex: 1;
      max-width: 420px;
      position: relative;
    }

    .search-input {
      width: 100%;
      height: 40px;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 0 16px 0 38px;
      font-size: 0.88rem;
      font-weight: 500;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
    }

    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .orders-btn {
      background-color: var(--accent);
      color: #04130d;
      border: none;
      border-radius: 999px;
      padding: 9px 18px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .orders-btn:hover {
      background-color: #34d399;
      transform: translateY(-1px);
    }

    .orders-count {
      background: #04130d;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
    }

    .profile-circle {
      width: 38px;
      height: 38px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 50%;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    .profile-circle:hover {
      border-color: var(--accent);
      transform: scale(1.05);
    }

    /* Hero Banner + Contador Primer Drop */
    .hero-banner {
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 20% 20%, rgba(16, 185, 129, 0.18), transparent 45%),
                  radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.14), transparent 50%),
                  linear-gradient(180deg, #121218 0%, #0b0b0e 100%);
      border-bottom: 1px solid var(--border-subtle);
      padding: 46px 24px;
      text-align: center;
    }

    .hero-inner {
      max-width: 820px;
      margin: 0 auto;
    }

    .drop-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
