<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Essence Vault — Primer Drop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Montserrat", sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      animation: fadeInPage 0.35s ease;
    }

    @keyframes fadeInPage {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    .topbar {
      background-color: #cfd5dc;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      position: relative;
      z-index: 40;
    }

    .brand {
      color: #7c848d;
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1;
      text-decoration: none;
      text-align: center;
      letter-spacing: 0.4px;
      transition: color 0.2s ease;
    }

    .brand:hover {
      color: #4b5563;
    }

    .brand span {
      display: block;
    }

    .orders-top-btn {
      background: linear-gradient(180deg, #fce055 0%, #eab308 100%);
      color: #000000;
      border: 3px solid #000000;
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .orders-top-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 190px;
      max-width: 310px;
    }

    .search-input {
      width: 100%;
      height: 36px;
      background-color: #ffffff;
      border: 3px solid #000000;
      border-radius: 999px;
      padding: 0 38px 0 14px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #111827;
      outline: none;
    }

    .search-input::placeholder {
      color: #9ca3af;
      font-weight: 500;
    }

    .search-loupe {
      position: absolute;
      right: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      pointer-events: none;
    }

    .cart-top-btn {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      color: #000000;
      border: 3px solid #000000;
      border-radius: 999px;
      padding: 5px 16px;
      font-size: 0.95rem;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .cart-top-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .profile-wrap {
      position: relative;
    }

    .avatar-circle {
      width: 38px;
      height: 38px;
      background-color: #000000;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.18s ease;
    }

    .avatar-circle:hover {
      transform: scale(1.06);
    }

    /* Mini apartado "Más Opciones" */
    .more-options-popover {
      position: absolute;
      right: 0;
      top: 46px;
      width: 215px;
      background-color: #ffffff;
      border: 3px solid #000000;
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
      z-index: 90;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .more-options-popover.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .more-options-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: #000000;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 2px solid #e5e7eb;
    }

    .more-options-btn {
      width: 100%;
      background: linear-gradient(180deg, #fce055 0%, #eab308 100%);
      color: #000000;
      border: 2.5px solid #000000;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .more-options-btn:hover {
      transform: scale(1.02);
    }

    .drop-banner {
      background: linear-gradient(180deg, #6e7785 0%, #4b525e 52%, #111317 100%);
      color: #ffffff;
      padding: 12px 16px 14px;
      text-align: center;
    }

    .drop-heading {
      font-size: clamp(1.35rem, 3.2vw, 2.2rem);
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .timer-row {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(8px, 2vw, 18px);
      flex-wrap: wrap;
    }

    .timer-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .timer-num {
      font-size: clamp(2.1rem, 5.5vw, 3.6rem);
      font-weight: 500;
      line-height: 1.05;
      color: #ffffff;
    }

    .timer-label {
      font-size: clamp(0.75rem, 1.6vw, 1.05rem);
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .timer-colon {
      font-size: clamp(2rem, 5vw, 3.3rem);
      font-weight: 500;
      line-height: 1;
      color: #ffffff;
      padding-top: 2px;
    }

    .welcome-bar {
      background-color: #ff2a2a;
      color: #000000;
      text-align: center;
      padding: 5px 12px;
      font-size: clamp(0.95rem, 2.2vw, 1.4rem);
      font-weight: 700;
    }

    .featured-wrapper {
      padding: 10px 14px 24px;
    }

    .featured-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .featured-title {
      font-size: clamp(1.25rem, 2.8vw, 2rem);
      font-weight: 600;
      color: #000000;
    }

    .available-label {
      font-size: clamp(1.1rem, 2.5vw, 1.85rem);
      font-weight: 500;
      color: #000000;
    }

    .showcase-panel {
      background: linear-gradient(180deg, #9aa3b0 0%, #59606b 100%);
      border-radius: 34px;
      padding: 22px 24px 28px;
      min-height: 360px;
    }

    .product-item {
      width: 196px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #000000;
      transition: transform 0.22s ease;
    }

    .product-item:hover {
      transform: translateY(-4px);
    }

    .shirt-card {
      width: 176px;
      height: 176px;
      background-color: #ffffff;
      border: 4px solid #000000;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.18);
    }

    .info-pill {
      width: 100%;
      background-color: #d4d4d8;
      border-radius: 28px;
      padding: 12px 10px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2);
    }

    .product-name {
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.15;
      text-transform: uppercase;
      color: #000000;
    }

    .product-price {
      font-size: 1.25rem;
      font-weight: 700;
      color: #000000;
      margin: 4px 0 8px;
    }

    .add-pill-btn {
      width: 100%;
      background: linear-gradient(180deg, #4ade80 0%, #15803d 100%);
      color: #000000;
      border: none;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
      transition: filter 0.18s ease, transform 0.15s ease;
    }

    .add-pill-btn:hover {
      filter: brightness(1.06);
      transform: scale(1.02);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background-color: #ffffff;
      border: 3px solid #000000;
      border-radius: 20px;
      max-width: 400px;
      width: 100%;
      padding: 20px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e5e7eb;
    }

    .close-modal {
      background-color: #000000;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 4px 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-link {
      display: block;
      margin-top: 14px;
      text-align: center;
      background-color: #16a34a;
      color: #ffffff;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 10px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="brand">
      <span>ESSENCE</span>
      <span>VAULT</span>
    </a>

    <button id="ordersBtn" type="button" class="orders-top-btn">
      Mis pedidos 📦 (<span id="ordersCount">0</span>)
    </button>

    <div class="search-box">
      <input id="searchInput" type="text" class="search-input" placeholder="Buscar algo..." />
      <span class="search-loupe">🔍</span>
    </div>

    <a href="carrito.html" class="cart-top-btn">
      Mi carrito 🛒 (<span id="cartCount">0</span>)
    </a>

    <div class="profile-wrap">
      <button id="profileBtn" type="button" class="avatar-circle" aria-label="Más opciones"></button>
      <div id="moreOptionsPopover" class="more-options-popover" role="menu">
        <div class="more-options-title">Más Opciones</div>
        <button id="goAccountOrLoginBtn" type="button" class="more-options-btn">Ir a cuenta</button>
      </div>
    </div>
  </header>

  <section class="drop-banner" aria-label="Primer Drop">
    <h1 class="drop-heading">PRIMER DROP</h1>
    <div class="timer-row">
      <div class="timer-unit">
        <span id="daysVal" class="timer-num">05</span>
        <span class="timer-label">DÍAS</span>
      </div>
      <span class="timer-colon">:</span>
      <div class="timer-unit">
        <span id="hoursVal" class="timer-num">00</span>
        <span class="timer-label">HORAS</span>
      </div>
      <span class="timer-colon">:</span>
      <div class="timer-unit">
        <span id="minsVal" class="timer-num">00</span>
        <span class="timer-label">MINUTOS</span>
      </div>
      <span class="timer-colon">:</span>
      <div class="timer-unit">
        <span id="secsVal" class="timer-num">00</span>
        <span class="timer-label">SEGUNDOS</span>
      </div>
    </div>
  </section>

  <div id="welcomeBar" class="welcome-bar">
    Bienvenido a Essence Vault! @Usuario
  </div>

  <main class="featured-wrapper">
    <div class="featured-header">
      <h2 class="featured-title">Productos Destacados</h2>
      <span id="availableText" class="available-label">Disponibles: 0 (5:00:00:00)</span>
    </div>

    <div class="showcase-panel">
      <div id="catalogGrid">
        <div class="product-item" data-search="camisa essentials">
          <a href="producto.html?id=1" class="shirt-card" aria-label="Ver Camisa Essentials">
            <svg width="118" height="118" viewBox="0 0 120 120" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M38 18c5 7 10 10 22 10s17-3 22-10l22 14-11 22-13-7v59H40V43l-13 7-11-22 22-14z" fill="#ffffff"/>
              <path d="M38 18c5 7 10 10 22 10s17-3 22-10" />
              <path d="M16 32l11 18" />
              <path d="M104 32L93 50" />
              <path d="M40 97h40" />
            </svg>
          </a>

          <div class="info-pill">
            <a href="producto.html?id=1" style="text-decoration:none; color:inherit;">
              <div class="product-name">CAMISA</div>
              <div class="product-name">ESSENTIALS</div>
            </a>
            <div class="product-price">$350</div>
            <button id="quickAddBtn" type="button" class="add-pill-btn">Agregar al carrito</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <strong id="modalTitle">Mis pedidos</strong>
        <button id="closeModal" type="button" class="close-modal">X</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    const FIVE_DAYS_MS = 5 * 24 * 60 * 60 * 1000;
    const DROP_KEY = "essence_primer_drop_end";
    let dropEnd = Number(localStorage.getItem(DROP_KEY));

    if (!dropEnd || isNaN(dropEnd) || dropEnd <= Date.now()) {
      dropEnd = Date.now() + FIVE_DAYS_MS;
      localStorage.setItem(DROP_KEY, String(dropEnd));
    }

    const daysVal = document.getElementById("daysVal");
    const hoursVal = document.getElementById("hoursVal");
    const minsVal = document.getElementById("minsVal");
    const secsVal = document.getElementById("secsVal");
    const availableText = document.getElementById("availableText");

    function twoDigits(n) {
      return String(n).padStart(2, "0");
    }

    function tickTimer() {
      const remaining = Math.max(0, dropEnd - Date.now());
      const d = Math.floor(remaining / (1000 * 60 * 60 * 24));
      const h = Math.floor((remaining / (1000 * 60 * 60)) % 24);
      const m = Math.floor((remaining / (1000 * 60)) % 60);
      const s = Math.floor((remaining / 1000) % 60);

      daysVal.textContent = twoDigits(d);
      hoursVal.textContent = twoDigits(h);
      minsVal.textContent = twoDigits(m);
      secsVal.textContent = twoDigits(s);

      availableText.textContent = `Disponibles: 0 (${d}:${twoDigits(h)}:${twoDigits(m)}:${twoDigits(s)})`;
    }

    tickTimer();
    setInterval(tickTimer, 1000);

    // Sesión activa
    const activeSession = JSON.parse(localStorage.getItem("essence_active_session") || "null");
    const welcomeBar = document.getElementById("welcomeBar");
    if (activeSession && activeSession.username) {
      welcomeBar.textContent = `Bienvenido a Essence Vault! @${activeSession.username}`;
    }

    // Popover "Más Opciones" en el botón negro
    const profileBtn = document.getElementById("profileBtn");
    const moreOptionsPopover = document.getElementById("moreOptionsPopover");
    const goAccountOrLoginBtn = document.getElementById("goAccountOrLoginBtn");

    goAccountOrLoginBtn.textContent = activeSession ? "Ir a cuenta.html" : "Iniciar sesión / Crear";

    profileBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      moreOptionsPopover.classList.toggle("open");
    });

    document.addEventListener("click", (e) => {
      if (!moreOptionsPopover.contains(e.target) && e.target !== profileBtn) {
        moreOptionsPopover.classList.remove("open");
      }
    });

    goAccountOrLoginBtn.addEventListener("click", () => {
      const sessionNow = JSON.parse(localStorage.getItem("essence_active_session") || "null");
      window.location.href = sessionNow ? "cuenta.html" : "iniciodesesion.html";
    });

    // Buscador
    const searchInput = document.getElementById("searchInput");
    const productItem = document.querySelector(".product-item");
    searchInput.addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      const target = productItem.dataset.search || "";
      productItem.style.display = target.includes(q) ? "flex" : "none";
    });

    // Badges
    const cartCountEl = document.getElementById("cartCount");
    const ordersCountEl = document.getElementById("ordersCount");

    function syncCounters() {
      const cart = JSON.parse(localStorage.getItem("essence_cart") || "[]");
      const qtyTotal = cart.reduce((acc, item) => acc + (item.qty || 1), 0);
      cartCountEl.textContent = qtyTotal;

      const orders = JSON.parse(localStorage.getItem("essence_orders") || "[]");
      ordersCountEl.textContent = orders.length;
    }

    document.getElementById("quickAddBtn").addEventListener("click", () => {
      const cart = JSON.parse(localStorage.getItem("essence_cart") || "[]");
      const existing = cart.find((item) => item.id === 1 && item.size === "M");
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id: 1, name: "Camisa Essentials", price: 350, size: "M", qty: 1 });
      }
      localStorage.setItem("essence_cart", JSON.stringify(cart));
      syncCounters();
    });

    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalTitle = document.getElementById("modalTitle");
    const modalBody = document.getElementById("modalBody");

    function openModal(title, html) {
      modalTitle.textContent = title;
      modalBody.innerHTML = html;
      modalBackdrop.classList.add("open");
    }

    document.getElementById("ordersBtn").addEventListener("click", () => {
      const orders = JSON.parse(localStorage.getItem("essence_orders") || "[]");
      if (!orders.length) {
        openModal(
          "Mis pedidos",
          `<p style="font-size:0.9rem; color:#4b5563;">Aún no tienes pedidos realizados.</p><a href="carrito.html" class="modal-link">Ir a Mi carrito 🛒</a>`
        );
        return;
      }
      const items = orders
        .map((o, i) => `<li style="margin-bottom:6px;">#${i + 1} — ${o.summary} ($${o.total} MXN)</li>`)
        .join("");
      openModal("Mis pedidos", `<ul style="padding-left:18px; font-size:0.9rem;">${items}</ul>`);
    });

    document.getElementById("closeModal").addEventListener("click", () => {
      modalBackdrop.classList.remove("open");
    });

    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) modalBackdrop.classList.remove("open");
    });

    syncCounters();
  </script>
</body>
</html>
