<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Essence Vault</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Courier New", Courier, monospace;
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
    }

    /* Barra superior */
    .topbar {
      background-color: #666666;
      border-bottom: 3px solid #000000;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      white-space: nowrap;
      text-decoration: none;
    }

    .search-wrap {
      flex: 1;
      max-width: 390px;
    }

    .search-input {
      width: 100%;
      height: 30px;
      background-color: #ffffff;
      border: 2.5px solid #000000;
      border-radius: 9px;
      padding: 2px 12px;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.95rem;
      color: #000000;
      outline: none;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .orders-btn {
      background-color: #00a63e;
      color: #ffffff;
      border: 2.5px solid #000000;
      border-radius: 9px;
      padding: 3px 12px;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }

    .orders-btn:hover {
      background-color: #008f35;
      transform: translateY(-1px);
    }

    .profile-circle {
      width: 34px;
      height: 34px;
      background-color: #000000;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.12s ease;
    }

    .profile-circle:hover {
      transform: scale(1.06);
    }

    /* Banner de anuncio */
    .announcement-banner {
      background-color: #787878;
      border-bottom: 4px solid #000000;
      min-height: 195px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .announcement-text {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 6vw, 4.4rem);
      color: #ffffff;
      letter-spacing: 2px;
      font-weight: 400;
    }

    /* Sección de productos destacados */
    .featured-section {
      padding: 14px 12px 24px;
    }

    .section-title {
      font-family: "Courier New", Courier, monospace;
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 10px;
      padding-left: 2px;
    }

    .products-panel {
      background-color: #bdbdbd;
      border: 4px solid #000000;
      border-top-left-radius: 75px;
      border-top-right-radius: 75px;
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 6px;
      padding: 34px 36px 26px;
      min-height: 280px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 26px 32px;
      align-items: start;
    }

    .product-card {
      display: flex;
